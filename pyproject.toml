[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "interpkit"
version = "0.5.0"
description = "Mech interp for any HuggingFace model."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Davide Zani" }]
keywords = ["mechanistic-interpretability", "pytorch", "transformers", "mech-interp", "interpretability"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.1",
    "numpy>=1.24",
    # interpkit hooks deep into transformers internals (module naming,
    # attention impls, checkpoint loading), so major versions can break
    # it. The 4.x->5.x jump already changed checkpoint-key mapping
    # (see N-010 in interpkit/core/loader.py). Tested through 5.x; cap
    # the next major until validated against it.
    "transformers>=4.36,<6",
    "safetensors>=0.4",
    "rich>=13.0",
    "rich-gradient>=0.3",
    "typer>=0.9",
    "Pillow>=10.0",
    "matplotlib>=3.8",
    "huggingface-hub>=0.20",
    # Required for models whose only tokenizer is SentencePiece-based and has
    # no fast variant (Marian / opus-mt, XLM, some T5/ALBERT checkpoints).
    # Without it those models load tokenizer-less and string-input ops fail.
    "sentencepiece>=0.1.99",
]

[project.optional-dependencies]
vision = [
    "torchvision>=0.16",
]
probe = [
    "scikit-learn>=1.3",
]
dev = [
    "pytest>=7.0",
    "pytest-timeout>=2.2",
    "pytest-cov>=5.0",
    "scikit-learn>=1.3",
    "torchvision>=0.16",
    "ruff>=0.4",
    "mypy>=1.8",
]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.24",
]

[project.urls]
Homepage = "https://github.com/z4nix/interpkit"
Repository = "https://github.com/z4nix/interpkit"
Issues = "https://github.com/z4nix/interpkit/issues"

[project.scripts]
interpkit = "interpkit.cli.main:run"

[tool.setuptools.packages.find]
include = ["interpkit*"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501", "SIM108", "SIM105", "SIM103", "E741", "B905"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
ignore_missing_imports = true
# PyTorch's type stubs are weak: ``nn.Module.__getattr__`` is typed
# ``Tensor | Module``, so the resolver's heavy use of ``getattr`` /
# ``named_modules`` / submodule access produces many false positives —
# "Tensor not callable", "not indexable", "no attribute", "Returning Any".
# These dominate the noise without flagging real bugs (the full test suite
# passes). Disable the stub-driven codes; mypy still gates on the codes that
# catch genuine structural issues (undefined names, redefinitions, bad
# returns, missing attributes on our own types).
warn_return_any = false
disable_error_code = ["operator", "index", "union-attr", "assignment", "arg-type", "misc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 300
markers = [
    "slow: tests that download large models or sweep many architectures",
    "tol_numeric: numerical-tolerance tests that may flake on different hardware",
]

[tool.coverage.run]
source = ["interpkit"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 60
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__",
]
